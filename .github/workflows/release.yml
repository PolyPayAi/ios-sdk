name: Release

on:
  push:
    tags: ['v*.*.*']

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  release:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Verify package
        shell: bash
        run: |
          device_id=$(xcrun simctl list devices available -j | jq -r '[.devices[][] | select(.name | startswith("iPhone"))][0].udid')
          test -n "$device_id"
          xcodebuild -scheme PolyPayCheckout -destination "platform=iOS Simulator,id=$device_id" test CODE_SIGNING_ALLOWED=NO
      - name: Create source package
        run: |
          git archive --format=zip --prefix=PolyPayCheckout-${GITHUB_REF_NAME}/ -o PolyPayCheckout-${GITHUB_REF_NAME}.zip HEAD
          shasum -a 256 PolyPayCheckout-${GITHUB_REF_NAME}.zip > PolyPayCheckout-${GITHUB_REF_NAME}.zip.sha256
      - uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2
        with:
          subject-path: PolyPayCheckout-${{ github.ref_name }}.zip
      - uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          generate_release_notes: true
          files: |
            PolyPayCheckout-${{ github.ref_name }}.zip
            PolyPayCheckout-${{ github.ref_name }}.zip.sha256
