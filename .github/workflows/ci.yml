name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - run: swift test
      - run: xcodebuild -scheme PolyPayCheckout -destination 'generic/platform=iOS Simulator' build CODE_SIGNING_ALLOWED=NO
